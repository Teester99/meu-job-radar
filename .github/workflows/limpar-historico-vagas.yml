name: Limpar historico de vagas

on:
  workflow_dispatch:

concurrency:
  group: jobradar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  limpar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia do banco
        run: python -m pip install python-dotenv==1.2.2
      - name: Limpar vagas e verificar preservacao dos inscritos
        run: |
          python - <<'PYTHON'
          import sqlite3
          from config import DB_PATH
          from database.database import iniciar_db, reiniciar_historico_vagas

          iniciar_db()
          def estado_preservado():
              with sqlite3.connect(DB_PATH) as conn:
                  inscritos = conn.execute('SELECT * FROM assinantes_telegram ORDER BY chat_id').fetchall()
                  metadados = conn.execute(
                      "SELECT chave, valor FROM metadados WHERE chave != 'vagas_historico_reiniciado' ORDER BY chave"
                  ).fetchall()
                  return inscritos, metadados

          antes = estado_preservado()
          removidas = reiniciar_historico_vagas()
          if estado_preservado() != antes:
              raise RuntimeError('Inscritos ou metadados alterados; limpeza nao sera publicada.')
          iniciar_db()
          with sqlite3.connect(DB_PATH) as conn:
              if conn.execute('SELECT COUNT(*) FROM vagas_vistas').fetchone()[0] != 0:
                  raise RuntimeError('O historico nao ficou vazio.')
              if conn.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
                  raise RuntimeError('Falha de integridade; limpeza nao sera publicada.')
          print(f'Vagas removidas nesta execucao: {removidas}. Inscritos e metadados preservados.')
          PYTHON
      - name: Salvar limpeza no repositorio
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add data/jobs.db
          if git diff --cached --quiet; then
            echo "Historico ja estava vazio; nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "chore: reinicia historico de vagas [skip ci]"
          git push origin HEAD:main
